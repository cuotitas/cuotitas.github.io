<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cuotitas · Tareas</title>
    <meta name="description" content="Cuotitas: paga a plazos, fácil y seguro. Tareas pendientes del proyecto.">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="index.css">
<script>try{const t=localStorage.getItem('cuotitas-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
.tasks{display:grid;gap:12px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .2s}
.task:hover{border-color:var(--accent)}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.task .body{display:grid;gap:6px;min-width:0}
.task .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.task .tag{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.task .who{font:500 12px var(--f-mono);color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.task b{font-size:16px;color:var(--ink)}
.task .d{font-size:14px;color:var(--ink-2)}
.task:has(input:checked) b{text-decoration:line-through;color:var(--muted)}
.tbar{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ink-2);margin:6px 0 18px}
.tbar .bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.tbar .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
</style>
</head>
<body>
<main style="max-width:900px;margin:0 auto;padding:28px 16px 60px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px">
    <a class="btn" href="index.html" style="display:inline-block;text-decoration:none">← Volver a Cuotitas</a>
    <button class="theme" id="theme" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
  </div>
  <header>
    <span class="eyebrow">Tareas del proyecto</span>
    <h2>Lo que falta para lanzar Cuotitas</h2>
    <p class="lead">Pendientes legales, de socios, comerciales y de financiamiento. Marca cada una cuando esté lista.</p>
  </header>
  <div class="tbar"><span><b class="num" id="done">0</b> de <span id="total"></span> listas</span><div class="bar"><i id="prog"></i></div></div>
  <div class="tasks">
    <label class="task"><input type="checkbox" data-k="t1"><span class="body"><span class="top"><span class="tag">Legal</span><span class="who">Por asignar</span></span><b>Confirmar con ASFI y un abogado la licencia para "compra ahora, paga después"</b><span class="d">El decreto de fintech (DS 5384) no nombra este modelo; definir si entra como plataforma de financiamiento o como empresa que compra cuentas por cobrar.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t2"><span class="body"><span class="top"><span class="tag">Legal</span><span class="who">Por asignar</span></span><b>Consultar a un abogado si se puede cobrar la multa de Bs 50 por cuota vencida</b><span class="d">La multa queda para Cuotitas por gestión de cobro. En compras chicas la cuota puede ser de unos Bs 40, así que la multa sería mayor que la cuota.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t3"><span class="body"><span class="top"><span class="tag">Legal</span><span class="who">Leo Fernández</span></span><b>Ver si se puede reportar a los clientes morosos a la central de riesgo</b><span class="d">Infocred y la central de ASFI: qué tipo de entidad hay que ser, costo, consentimiento del cliente al registrarse y desde cuántos días de atraso se reporta.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t8"><span class="body"><span class="top"><span class="tag">Técnico</span><span class="who">Por asignar</span></span><b>Conseguir la API de la central de riesgo y el proveedor de reconocimiento facial</b><span class="d">Para el registro del cliente: consultar a Infocred o a la central de ASFI por API, y elegir el proveedor de selfie con prueba de vida y lectura del CI. El modelo supone unos Bs 8 por usuario nuevo verificado.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t4"><span class="body"><span class="top"><span class="tag">Socios</span><span class="who">Por asignar</span></span><b>Firmar el contrato y el pacto de socios, revisado por un abogado</b><span class="d">Reparto de acciones: 10% Servisofts, 10% Leo y 80% Grupo Cuotitas.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t5"><span class="body"><span class="top"><span class="tag">Socios</span><span class="who">Roy Ruddy Paz</span></span><b>Definir los nombres de las 3 personas de Grupo Cuotitas</b><span class="d">Para el contrato y el registro de la empresa.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t6"><span class="body"><span class="top"><span class="tag">Comercial</span><span class="who">Por asignar</span></span><b>Cerrar los 15 comercios grandes de lanzamiento</b><span class="d">Llenar la lista de la página de clientes a medida que se firmen los convenios.</span></span></label>
    <label class="task"><input type="checkbox" data-k="t7"><span class="body"><span class="top"><span class="tag">Financiamiento</span><span class="who">Por asignar</span></span><b>Conseguir unos Bs 20,8 M de deuda para la cartera</b><span class="d">Con el plan de bajo costo, la necesidad de caja llega a su pico de Bs 31,1 M en el mes 31; los socios ponen Bs 11,25 M en efectivo y el resto lo pone un banco o fondo de cartera desde el mes 14.</span></span></label>
  </div>
  <p class="note">Las marcas se guardan solo en este navegador.</p>
</main>
<script>
(function(){const $=s=>document.querySelector(s),root=document.documentElement,boxes=[...document.querySelectorAll('.task input')];
 let st={};try{st=JSON.parse(localStorage.getItem('cuotitas-tareas')||'{}')}catch(e){}
 const upd=()=>{const n=boxes.filter(b=>b.checked).length;$('#done').textContent=n;$('#total').textContent=boxes.length;$('#prog').style.width=(n/boxes.length*100)+'%'};
 boxes.forEach(b=>{b.checked=!!st[b.dataset.k];b.addEventListener('change',()=>{st[b.dataset.k]=b.checked;try{localStorage.setItem('cuotitas-tareas',JSON.stringify(st))}catch(e){}upd()})});upd();
 $('#theme').addEventListener('click',()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('cuotitas-theme',root.dataset.theme)}catch(e){}})})();
</script>
</body>
</html>
